    <!-- Anti-Caching Headers for Instant Real-Time Freshness on Mobile & Desktop -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Immediate Theme Initialization (Default: Day / Light Mode) to eliminate FOUC -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme') || 
                           localStorage.getItem('app_theme') || 
                           localStorage.getItem('filemarket_theme') || 
                           localStorage.getItem('preferred_theme') || 
                           localStorage.getItem('fm_theme');
          
          if (!savedTheme) {
            savedTheme = 'light';
            localStorage.setItem('theme', 'light');
            localStorage.setItem('app_theme', 'day');
          }

          if (savedTheme === 'night' || savedTheme === 'dark') {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      })();
    </script>

    <!-- Dynamic Google Search Console Verification & SEO Immediate Pre-loader -->
    <script type="text/javascript">
      (function() {
        try {
          var raw = localStorage.getItem('fm_seo_settings');
          if (raw) {
            var data = JSON.parse(raw);
            if (data && data.googleVerificationToken) {
              var token = data.googleVerificationToken;
              var match = token.match(/content\s*=\s*["']([^"']+)["']/i);
              if (match && match[1]) {
                token = match[1];
              } else {
                token = token.replace(/^[<"']+|[>"'/]+$/g, '').trim();
              }
              if (token) {
                var meta = document.querySelector('meta[name="google-site-verification"]');
                if (!meta) {
                  meta = document.createElement('meta');
                  meta.name = 'google-site-verification';
                  document.head.appendChild(meta);
                }
                meta.content = token;
              }
            }
            if (data && data.metaTitle) {
              document.title = data.metaTitle;
            }
          }
        } catch (e) {}
      })();
    </script>

    <!-- AdCash aclib Safe Initializer & Polyfill to prevent "aclib is not defined" crashes -->
    <script type="text/javascript">
      (function() {
        if (typeof window.aclib === 'undefined') {
          var queue = [];
          var stubFn = function() {
            var args = Array.prototype.slice.call(arguments);
            queue.push(args);
          };
          window.aclib = new Proxy({
            runAutoTag: stubFn,
            runPop: stubFn,
            runBanner: stubFn,
            runInPagePush: stubFn,
            init: stubFn,
            _queue: queue
          }, {
            get: function(target, prop) {
              if (prop in target) return target[prop];
              return stubFn;
            }
          });
        }
        // Safety listener to catch any unhandled ad script ReferenceErrors
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('aclib is not defined') !== -1) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>
    <script id="aclib-cdn" type="text/javascript" src="//acscdn.com/script/aclib.js" async crossorigin="anonymous"></script>

    <!-- GitHub Pages SPA Redirect Recovery -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
